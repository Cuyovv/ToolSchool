<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Snake</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #catalogOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            overflow-y: auto;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
        }
        #searchBar {
            width: 80%;
            max-width: 600px;
            padding: 15px;
            border-radius: 25px;
            border: 2px solid #444;
            font-size: 18px;
            margin-top: 20px;
            background: #222;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        #searchBar:focus {
            border-color: #8BC34A;
        }
        .game-card {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .game-card:hover { transform: scale(1.05); background: #444; }
        .game-card img { width: 100%; border-radius: 4px; margin-bottom: 10px; }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="catalogOverlay">
        <div class="close-btn" onclick="closeCatalog()">×</div>
        <h1>Game Catalog</h1>
        <input type="text" id="searchBar" placeholder="Search 800+ games..." oninput="filterGames()">
        <div id="catalogGrid" class="catalog-grid"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gridSize = 60;
        let tileCountX, tileCountY;
        let dx = 0;
        let dy = 0;
        let snake = [];
        let activeKey = null;
        let isCatalogOpen = false;
        let food = { x: 10, y: 10 };
        let gameSpeed = 100; // Milliseconds per update
        let lastTime = 0;
        let allGames = [];

        function init() {
            window.focus();
            resize();
            resetGame();
            fetchGames();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            tileCountX = Math.floor(canvas.width / gridSize);
            tileCountY = Math.floor(canvas.height / gridSize);
        }

        function resetGame() {
            dx = 0;
            dy = 0;
            // Start snake in the middle
            const centerX = Math.floor(tileCountX / 2);
            const centerY = Math.floor(tileCountY / 2);
            snake = [
                { x: centerX, y: centerY },
                { x: centerX - 1, y: centerY },
                { x: centerX - 2, y: centerY }
            ];
            createFood();
        }

        function createFood() {
            food.x = Math.floor(Math.random() * tileCountX);
            food.y = Math.floor(Math.random() * tileCountY);
            // Make sure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) createFood();
            });
        }

        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);

            const deltaTime = currentTime - lastTime;
            if (deltaTime < gameSpeed) return;
            lastTime = currentTime;

            if (!isCatalogOpen && (dx !== 0 || dy !== 0)) update();
            draw();
        }

        function update() {
            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall collisions (Wrap around)
            if (head.x < 0) head.x = tileCountX - 1;
            if (head.x >= tileCountX) head.x = 0;
            if (head.y < 0) head.y = tileCountY - 1;
            if (head.y >= tileCountY) head.y = 0;

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                openCatalog();
                dx = 0; dy = 0; // Stop snake
            }
            snake.pop(); // Always remove the tail, so the snake doesn't grow
        }

        async function fetchGames() {
            // Try to load a local prebuilt index first (recommended).
            try {
                const resp = await fetch('games.json');
                if (resp.ok) {
                    const json = await resp.json();
                    allGames = json.map(g => ({
                        title: g.title,
                        filePath: g.filePath,
                        coverPath: g.coverPath
                    }));
                    return;
                }
            } catch (e) {
                // ignore and fall back
            }

            // Fallback: try GitHub API (only works for public repos)
            try {
                const response = await fetch('https://api.github.com/repos/yogi8/ToolSchool/contents/html-main');
                const files = await response.json();
                if (Array.isArray(files)) {
                    allGames = files
                        .filter(file => file.name.endsWith('.html') && file.name !== 'index.html')
                        .map(file => ({
                            title: file.name.replace('.html', '').replace(/[_-]/g, ' '),
                            filePath: 'html-main/' + file.name,
                            coverPath: 'covers-main/' + file.name.replace('.html', '.png')
                        }));
                }
            } catch (e) {
                console.error("Could not fetch game list automatically. Ensure the repo is public or provide games.json locally.");
            }
        }

        function openCatalog() {
            isCatalogOpen = true;
            document.getElementById('catalogOverlay').style.display = 'flex';
            document.getElementById('searchBar').focus();
            renderCatalog(allGames);
        }

        function filterGames() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allGames.filter(g => g.title.toLowerCase().includes(query));
            renderCatalog(filtered);
        }

        function renderCatalog(games) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = games.map(game => {
                const href = game.filePath || ('html-main/' + (game.file || game.fileName));
                const img = game.coverPath || ('covers-main/' + (game.cover || (game.file || game.fileName || '').replace('.html', '.png')));
                const placeholder = `https://via.placeholder.com/200x120?text=${encodeURIComponent(game.title)}`;
                return `
                <a href="${href}" class="game-card">
                    <img src="${img}" 
                         loading="lazy" 
                         onerror="this.src='${placeholder}'">
                    <strong>${game.title}</strong>
                </a>
            `;
            }).join('');
        }

        function closeCatalog() {
            isCatalogOpen = false;
            document.getElementById('catalogOverlay').style.display = 'none';
            createFood(); // Move food so player doesn't instantly reopen it
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            snake.forEach((part, index) => {
                const x = part.x * gridSize;
                const y = part.y * gridSize;
                const size = gridSize - 6;

                ctx.fillStyle = (index === 0) ? '#8BC34A' : '#4CAF50';
                ctx.fillRect(x, y, size, size);

                // Draw Eyes on the head
                if (index === 0) {
                    let headDx = dx;
                    let headDy = dy;

                    // If stopped, determine direction from the body relationship
                    if (headDx === 0 && headDy === 0 && snake.length > 1) {
                        headDx = snake[0].x - snake[1].x;
                        headDy = snake[0].y - snake[1].y;
                        // Handle wrap-around logic for eye direction
                        if (Math.abs(headDx) > 1) headDx = -Math.sign(headDx);
                        if (Math.abs(headDy) > 1) headDy = -Math.sign(headDy);
                    }

                    ctx.fillStyle = 'white';
                    const eyeSize = size / 6;
                    let e1x, e1y, e2x, e2y;

                    // Position eyes based on movement direction
                    if (headDx > 0) { [e1x, e1y, e2x, e2y] = [x + size * 0.7, y + size * 0.25, x + size * 0.7, y + size * 0.75]; }
                    else if (headDx < 0) { [e1x, e1y, e2x, e2y] = [x + size * 0.3, y + size * 0.25, x + size * 0.3, y + size * 0.75]; }
                    else if (headDy > 0) { [e1x, e1y, e2x, e2y] = [x + size * 0.25, y + size * 0.7, x + size * 0.75, y + size * 0.7]; }
                    else { [e1x, e1y, e2x, e2y] = [x + size * 0.25, y + size * 0.3, x + size * 0.75, y + size * 0.3]; }

                    // Draw whites of eyes
                    ctx.beginPath();
                    ctx.arc(e1x, e1y, eyeSize, 0, Math.PI * 2);
                    ctx.arc(e2x, e2y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Draw pupils
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(e1x, e1y, eyeSize / 2, 0, Math.PI * 2);
                    ctx.arc(e2x, e2y, eyeSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw Food
            ctx.font = `${gridSize - 2}px Arial`; // Adjust font size to fit within the grid
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Draw the folder emoji, centered within its grid cell
            ctx.fillText('📁', food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);
        }

        window.addEventListener('keydown', e => {
            if (isCatalogOpen) return;
            if (e.repeat) return;

            let newDx = dx;
            let newDy = dy;
            let isValidInput = false;

            if ((e.key === 'ArrowUp' || e.key === 'w') && dy !== 1) { newDx = 0; newDy = -1; isValidInput = true; }
            else if ((e.key === 'ArrowDown' || e.key === 's') && dy !== -1) { newDx = 0; newDy = 1; isValidInput = true; }
            else if ((e.key === 'ArrowLeft' || e.key === 'a') && dx !== 1) { newDx = -1; newDy = 0; isValidInput = true; }
            else if ((e.key === 'ArrowRight' || e.key === 'd') && dx !== -1) { newDx = 1; newDy = 0; isValidInput = true; }

            if (isValidInput) {
                dx = newDx;
                dy = newDy;
                activeKey = e.key;
                update(); // Move immediately on press
                draw();   // Render immediately
                lastTime = performance.now(); // Sync the game loop timer
            }

            // Prevent page scrolling for arrow keys and WASD
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === activeKey) {
                dx = 0;
                dy = 0;
                activeKey = null;
            }
        });

        window.addEventListener('resize', resize);

        init();
    </script>
</body>
</html>
